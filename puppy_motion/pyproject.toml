[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "puppy-motion"
version = "0.1.0"
description = "Safety logic for Puppy Mode: expressive motion for a Kinova Gen3 arm"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=5.4"]

[tool.setuptools]
packages = ["puppy_motion"]

[tool.setuptools.package-data]
puppy_motion = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
