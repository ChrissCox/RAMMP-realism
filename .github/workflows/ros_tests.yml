name: ros-tests
on:
  push:
    branches: ["feature/**"]
  pull_request:
    paths:
      - "puppy_playground/**"
      - "puppy_motion/**"
      - "docker/ros-test.Dockerfile"
      - ".github/workflows/ros_tests.yml"
jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ros-test.Dockerfile
          load: true
          tags: puppy-ros-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pytest puppy_playground (against the installed puppy_motion)
        run: |
          docker run --rm -v "$PWD":/repo -e PLAYGROUND_REQUIRE_INSTALLED_PUPPY_MOTION=1 puppy-ros-test:ci bash -c '
            set -e
            python3 -m pip install --upgrade "pip==24.3.1"
            python3 -m pip install /repo/puppy_motion
            python3 -m pip show puppy-motion
            cd /tmp && python3 -I /repo/puppy_playground/scripts/ci_installed_smoke.py
            cd /repo && python3 -m pytest puppy_playground/test -q
          '
